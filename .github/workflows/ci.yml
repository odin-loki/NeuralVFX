# Build and test on Ubuntu 24.04 with warnings as errors.
#   build   the libraries, tools and tests (ffmpeg installed so the video-ingest test runs; the BC7 and ASTC encoders of
#           the flipbook baselines fetched at pinned commits), plus a benchmark smoke run
#   viewer  the Dear ImGui viewer (fetched at a pinned tag) and its headless screenshot test under Xvfb; configured
#           without the encoders (the build that does without them)
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release, g++-14
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build libgtest-dev zlib1g-dev ffmpeg

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14 -DNEURALFX_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke runs
        run: |
          build/neuralfx_arch_bench --sizes 64 --frames 5
          build/nvfx_sim --effect fire --size 64 --frames 8 --out build/smoke.nfxclip
          build/nvfx_train --clips build/smoke.nfxclip --out build/smoke.nvfx --grid 16 --hidden 16 --iters 50 --pixels 512 --quiet
          build/nvfx_c_host build/smoke.nvfx 64 1

  viewer:
    name: Viewer (Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build git libgtest-dev zlib1g-dev \
            libglfw3-dev libgl-dev libgl1-mesa-dri xvfb xauth

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14
          -DNEURALFX_WERROR=ON -DNEURALFX_BUILD_VIEWER=ON -DNEURALFX_FETCH_ENCODERS=OFF

      - name: Build
        run: cmake --build build --target nvfx_viewer

      - name: Screenshot test
        run: ctest --test-dir build -R ViewerScreenshot --output-on-failure
